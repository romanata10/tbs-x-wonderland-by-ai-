# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.debug=false
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# NeoForge / Minecraft (1.21.1) - values match the official 1.21 MDK
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.176
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment parameter mappings (optional, but gives readable param names)
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# ---------------------------------------------------------------------------
# The bridge mod itself
# ---------------------------------------------------------------------------
mod_id=forgebridge
mod_name=ForgeBridge
mod_license=LGPL-2.1-only
mod_version=1.0.0
mod_group_id=dev.forgebridge
mod_authors=ForgeBridge contributors
mod_description=Runtime compatibility bridge that lets Forge 1.20.1 mods load and run on NeoForge 21.1 (Minecraft 1.21.1).\\nProvides ASM package remapping (net.minecraftforge -> net.neoforged), instruction-level redirects for the removed ItemStack NBT accessors and ResourceLocation constructors, an NBT-on-data-components emulation layer, descriptor (mods.toml) translation, an event-bus bridge, a registry lifecycle bridge that turns RegistryEvent registrations into DeferredRegister entries, and data/tag translation.

# Versions of the two mods this bridge has explicit compatibility profiles for.
target_mod_wonderland=wonderland
target_mod_broken_script=the_broken_script
